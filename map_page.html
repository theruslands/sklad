<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Где лежит? Карта склада</title>
<style>
:root{--bg:#E8E9E4;--surface:#F6F6F3;--ink:#1E2226;--muted:#5D646B;--line:#C5C8C1;--rack:#CDD1C9;--rack-ink:#2C3238;--hit:#F2C200;--hit-ink:#1E2226;--floor:#F1F2EE;--wall:#1E2226;--ok:#1E7A46;--err:#B3261E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1A1D20;--surface:#23272B;--ink:#ECEDE9;--muted:#A0A7AD;--line:#3A4046;--rack:#3A4047;--rack-ink:#E2E5DF;--floor:#202428;--wall:#ECEDE9;--ok:#5BC48A;--err:#FF8A7A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.5;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 48px)}
.wrap{max-width:820px;margin:0 auto}
.tape{height:10px;border-radius:3px;margin-bottom:18px;background:repeating-linear-gradient(-45deg,var(--hit) 0 14px,#1E2226 14px 28px)}
h1{font-size:clamp(32px,7vw,52px);line-height:1.02;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 18px}
input[type=search]{width:100%;font:inherit;font-size:20px;padding:15px 17px;border-radius:10px;border:2px solid var(--ink);background:var(--surface);color:var(--ink)}
input[type=search]:focus{outline:3px solid var(--hit);outline-offset:2px}
#answer{margin-top:24px}
.route{background:var(--surface);border-radius:12px;padding:18px;margin-bottom:16px;border-left:8px solid var(--hit)}
.route.warn{border-left-color:var(--err)}
.where{font-size:clamp(22px,5vw,32px);font-weight:800;line-height:1.15;margin:0 0 10px}
.where span{white-space:nowrap}
.items{margin:0 0 14px;padding:0;list-style:none}
.items li{padding:8px 0;border-bottom:1px solid var(--line)}
.items li:last-child{border-bottom:0}
.code{color:var(--muted);font-size:14px;white-space:nowrap}
.meta{display:block;color:var(--muted);font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.acts button,.acts select{font:inherit;font-size:15px;font-weight:700;padding:7px 12px;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.acts select{font-weight:600}
.acts .danger{border-color:var(--err);color:var(--err)}
.acts .danger.sure{background:var(--err);color:#fff}
.acts button:disabled{opacity:.5;cursor:default}
.msg{font-size:14px;font-weight:700;margin-top:4px}
.msg.ok{color:var(--ok)}.msg.err{color:var(--err)}
.empty{background:var(--surface);border-radius:12px;padding:18px;color:var(--muted)}
.plan{background:var(--surface);border-radius:10px;padding:12px 8px}
.plan svg{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.floor{fill:var(--floor)}.wall{fill:none;stroke:var(--wall);stroke-width:1.1}
.door{stroke:var(--hit);stroke-width:1.4;fill:none}.door-h{fill:var(--hit)}.door-t{fill:var(--ink);font-size:4px;font-weight:700}
.rk rect{fill:var(--rack)}.rk text{fill:var(--rack-ink)}
.rk .num{font-size:4.4px;font-weight:800}.rk .cnt{font-size:3px;opacity:.75}
.rk.hit rect{fill:var(--hit);stroke:var(--ink);stroke-width:.8}.rk.hit text{fill:var(--hit-ink);opacity:1}
.clickable .rk{cursor:pointer}
.rk:focus{outline:none}.rk:focus-visible rect{stroke:var(--hit);stroke-width:1.2}
h2{font-size:24px;font-weight:800;margin:44px 0 4px}
.hint{color:var(--muted);margin:0 0 14px;font-size:15px}
.contents{background:var(--surface);border-radius:12px;padding:16px 18px;margin-top:14px}
.contents h3{margin:0 0 8px;font-size:19px}
.muted{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="tape" aria-hidden="true"></div>
  <h1>Где лежит?</h1>
  <p class="lead">Штрихкод, название, артикул или код товара: покажу склад и стеллаж. Ошибочную запись можно перенести или убрать.</p>
  <input type="search" id="q" placeholder="Например: 8591806121942 или поло dhanu черный xl" autocomplete="off" aria-label="Что ищете">
  <div id="answer" aria-live="polite"></div>
  <h2 id="st"></h2>
  <p class="hint">Нажмите на стеллаж, чтобы увидеть, что на нём лежит.</p>
  <div id="ov"></div>
  <div id="cell"></div>
</div>
<script id="__data" type="application/json">__DATA_PLACEHOLDER__</script>
<script>
(function(){
  var D = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('__data').textContent.trim()))));
  var P = D.plan || { w: 100, h: 150, door: { from: 16, to: 34 } };
  var cells = D.cells || [];
  var byId = {}; cells.forEach(function(c){ byId[c.id] = c; });
  document.getElementById('st').textContent = D.store || 'Склад';
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var SRC = { scan: 'сканер', photo: 'по фото', legacy_map: 'старая карта', manual: 'вручную' };

  function plan(hits, clickable){
    var W = P.w, H = P.h, d = P.door, m = (d.from + d.to) / 2;
    var s = '<rect class="floor" x="0" y="0" width="' + W + '" height="' + H + '"/>';
    s += '<path class="wall" d="M' + d.from + ' 0 H0 V' + H + ' H' + W + ' V0 H' + d.to + '"/>';
    s += '<text class="door-t" x="' + m + '" y="-6" text-anchor="middle">вход</text><path class="door" d="M' + m + ' -4 V3"/><path class="door-h" d="M' + (m - 2.2) + ' 2 L' + m + ' 5.5 L' + (m + 2.2) + ' 2 Z"/>';
    cells.forEach(function(c){
      var r = c.plan; if (!r) return;
      var hit = hits.indexOf(c.id) >= 0;
      var a = clickable ? ' tabindex="0" role="button" aria-label="Стеллаж ' + esc(c.rack) + '"' : '';
      s += '<g class="rk' + (hit ? ' hit' : '') + '" data-cell="' + c.id + '"' + a + '><rect x="' + r.x + '" y="' + r.y + '" width="' + r.w + '" height="' + r.h + '" rx="1"/>';
      if (r.vertical) s += '<text class="num" x="' + (r.x + r.w / 2) + '" y="' + (r.y + r.h / 2 + 1.6) + '" text-anchor="middle">' + esc(c.rack) + '</text>';
      else {
        s += '<text class="num" x="' + (r.x + 2.5) + '" y="' + (r.y + r.h / 2 + 1.6) + '">' + esc(c.rack) + '</text>';
        if (c.items) s += '<text class="cnt" x="' + (r.x + r.w - 2) + '" y="' + (r.y + r.h / 2 + 1.1) + '" text-anchor="end">' + c.items + ' поз.</text>';
      }
      s += '</g>';
    });
    return '<div class="plan' + (clickable ? ' clickable' : '') + '"><svg viewBox="-3 -12 ' + (W + 6) + ' ' + (H + 15) + '" role="img" aria-label="Схема склада">' + s + '</svg></div>';
  }
  function rackOptions(except){
    return cells.filter(function(c){ return c.id !== except; }).map(function(c){ return '<option value="' + c.id + '">Стеллаж ' + esc(c.rack) + '</option>'; }).join('');
  }
  function itemLi(it, cellId){
    var code = it.code ? ' <span class="code">' + esc(it.code) + '</span>' : '';
    var meta = [SRC[it.source] || it.source, it.at, it.note].filter(Boolean).map(esc).join(' · ');
    var acts = it.id ? '<div class="acts" data-id="' + it.id + '"><select aria-label="Куда перенести"><option value="">Перенести на…</option>' + rackOptions(cellId) + '</select><button type="button" data-act="move">Перенести</button><button type="button" class="danger" data-act="unlink">Убрать отсюда</button></div><div class="msg"></div>' : '';
    return '<li>' + esc(it.name) + code + (meta ? '<span class="meta">' + meta + '</span>' : '') + acts + '</li>';
  }

  var ans = document.getElementById('answer'), q = document.getElementById('q'), timer = null, seq = 0;
  q.addEventListener('input', function(){ clearTimeout(timer); timer = setTimeout(find, 300); });
  function find(){
    var text = q.value.trim(); var my = ++seq;
    if (text.length < 2){ ans.innerHTML = ''; return; }
    ans.innerHTML = '<div class="empty">Ищу…</div>';
    fetch('/webhook/sklad/map/find?q=' + encodeURIComponent(text)).then(function(r){ return r.json(); }).then(function(res){
      if (my !== seq) return;
      var rows = Array.isArray(res) ? res : (res.items || []);
      var unplaced = (res && res.unplaced) || [];
      var html = '';
      if (unplaced.length) html += '<div class="route warn"><p class="where">Нигде не размещено</p><ul class="items">' + unplaced.map(function(u){ return '<li>' + esc(u.name) + (u.code ? ' <span class="code">' + esc(u.code) + '</span>' : '') + '</li>'; }).join('') + '</ul><p class="muted">Товар есть в МоёмСкладе, но на карту его ещё не отсканировали.</p></div>';
      if (!rows.length && !unplaced.length){ ans.innerHTML = '<div class="empty">По запросу «<b>' + esc(text) + '</b>» ничего нет. Если это штрихкод — его нет в МоёмСкладе.</div>'; return; }
      var groups = {}, order = [];
      rows.forEach(function(r){ if (!groups[r.cell_id]){ groups[r.cell_id] = []; order.push(r.cell_id); } groups[r.cell_id].push(r); });
      html += order.map(function(id){
        var g = groups[id], c = byId[id] || { rack: g[0].rack };
        return '<div class="route"><p class="where"><span>' + esc(g[0].store_name) + '</span> → <span>стеллаж ' + esc(c.rack) + '</span></p><ul class="items">' + g.map(function(it){ return itemLi(it, Number(id)); }).join('') + '</ul>' + plan([Number(id)], false) + '</div>';
      }).join('');
      ans.innerHTML = html;
    }).catch(function(){ if (my === seq) ans.innerHTML = '<div class="empty">Не удалось выполнить поиск. Проверьте интернет и попробуйте ещё раз.</div>'; });
  }

  var ov = document.getElementById('ov'), cellBox = document.getElementById('cell'), current = null;
  function drawOv(){ ov.innerHTML = plan(current ? [current] : [], true); }
  function openCell(id){
    current = id; drawOv();
    var c = byId[id];
    cellBox.innerHTML = '<div class="contents"><h3>Стеллаж ' + esc(c.rack) + '</h3><p class="muted">Загружаю…</p></div>';
    fetch('/webhook/sklad/map/cell?id=' + encodeURIComponent(id)).then(function(r){ return r.json(); }).then(function(res){
      var rows = Array.isArray(res) ? res : (res.items || []);
      cellBox.innerHTML = '<div class="contents"><h3>Стеллаж ' + esc(c.rack) + '</h3>' + (rows.length ? '<ul class="items">' + rows.map(function(it){ return itemLi(it, id); }).join('') + '</ul>' : '<p class="muted">Пока не заполнено.</p>') + '</div>';
    }).catch(function(){ cellBox.innerHTML = '<div class="contents"><p class="muted">Не удалось загрузить.</p></div>'; });
  }
  ov.addEventListener('click', function(e){ var g = e.target.closest('[data-cell]'); if (g) openCell(Number(g.getAttribute('data-cell'))); });
  ov.addEventListener('keydown', function(e){ if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-cell]')){ e.preventDefault(); openCell(Number(e.target.closest('[data-cell]').getAttribute('data-cell'))); } });

  function post(path, body){
    return fetch('/webhook/sklad/map/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function refresh(){ if (q.value.trim().length >= 2) find(); if (current) openCell(current); }
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if (!b) return;
    var box = b.closest('.acts'), id = Number(box.getAttribute('data-id')), msg = box.nextElementSibling;
    function say(t, ok){ msg.textContent = t; msg.className = 'msg ' + (ok ? 'ok' : 'err'); }
    if (b.getAttribute('data-act') === 'unlink'){
      if (!b.classList.contains('sure')){ b.classList.add('sure'); b.textContent = 'Точно убрать?'; setTimeout(function(){ b.classList.remove('sure'); b.textContent = 'Убрать отсюда'; }, 4000); return; }
      b.disabled = true;
      post('unlink', { id: id }).then(function(r){ if (!r || !r.ok) throw 0; say('Убрано ✓', true); setTimeout(refresh, 700); }).catch(function(){ b.disabled = false; say('Не удалось убрать', false); });
    } else {
      var to = Number(box.querySelector('select').value);
      if (!to){ say('Выберите стеллаж', false); return; }
      b.disabled = true;
      post('move', { id: id, cell: to }).then(function(r){ if (!r || !r.ok) throw 0; say('Перенесено на стеллаж ' + (byId[to] ? byId[to].rack : to) + ' ✓', true); setTimeout(refresh, 700); }).catch(function(){ b.disabled = false; say('Не удалось перенести', false); });
    }
  });
  drawOv();
})();
</script>
</body>
</html>
